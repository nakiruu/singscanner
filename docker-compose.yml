services:
  fundamentals:
    build: ./services/fundamentals-sidecar
    image: singscanner-fundamentals:latest
    container_name: singscanner-fundamentals
    restart: unless-stopped
    # Seed: the curated cache from the original Python project, shipped in the
    # repo at models/. Read-only, used to pre-populate the cache so the scanner
    # has Quality data BEFORE yfinance lets us back in.
    # Cache: persistent named volume so refresh progress survives rebuilds.
    volumes:
      - ./models:/seed:ro
      - fundamentals_cache:/cache
    environment:
      FUNDAMENTALS_SEED_PATH: /seed/fundamentals_seed.json
      FUNDAMENTALS_CACHE_PATH: /cache/fundamentals.json
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: singscanner-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: singscanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: singscanner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U singscanner -d singscanner"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: singscanner-ch
    restart: unless-stopped
    volumes:
      - chdata:/var/lib/clickhouse
      - ./services/clickhouse/init:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_USER: singscanner
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_DB: singscanner
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: singscanner:latest
    container_name: singscanner-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      fundamentals:
        condition: service_started
      clickhouse:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://singscanner:${POSTGRES_PASSWORD:-changeme}@postgres:5432/singscanner?schema=public
      FUNDAMENTALS_SIDECAR_URL: http://fundamentals:8000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
      ALPACA_FEED: ${ALPACA_FEED:-iex}
      SCANNER_HORIZON: ${SCANNER_HORIZON:-5d}
      SCANNER_UNIVERSE: ${SCANNER_UNIVERSE:-auto}
      SCANNER_MAX_SYMBOLS: ${SCANNER_MAX_SYMBOLS:-600}
      SCANNER_INTERVAL_S: ${SCANNER_INTERVAL_S:-15}
      SCANNER_MOCK: ${SCANNER_MOCK:-true}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-singscanner}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-singscanner}
      SHADOW_ENABLED: ${SHADOW_ENABLED:-true}
      SHADOW_HISTORICAL_LOOKBACK_DAYS: ${SHADOW_HISTORICAL_LOOKBACK_DAYS:-200}
      SHADOW_MIN_HISTORY_DAYS: ${SHADOW_MIN_HISTORY_DAYS:-100}
      SHADOW_BUCKET_FLUSH_DEBOUNCE_MS: ${SHADOW_BUCKET_FLUSH_DEBOUNCE_MS:-30000}
    ports:
      - "3097:3000"

volumes:
  pgdata:
  fundamentals_cache:
  chdata:
